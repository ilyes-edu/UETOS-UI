<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* UETOS UI kit - restyled single-timetable editor. Only visual rules changed; the <script> below is the original. */
  :root { --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif; --accent: #1f6fa8;
          --bg: #ffffff; --surface: #f5f8fc; --surface-2: #ebf1f8; --line: #e1e8f0; --line-2: #c9d6e3; --text: #162536; --muted: #62758a;
          --green: #1e9e57; --green-bg: #e1f5e8; --yellow: #c58b00; --yellow-bg: #fff2c9; --red: #d64545; --red-bg: #fde9e9;
          --blue: #3b6fd6; --blue-bg: #e4ecfc; --violet: #6d51c9; --violet-bg: #efeafd; --win: #c96a12; --win-a: #fff5e6; --win-b: #ffe8c7; }
  :root[data-theme="dark"] { --bg: #0f1823; --surface: #142030; --surface-2: #1a283b; --line: #22324a; --line-2: #31455f; --text: #e5edf6; --muted: #93a5ba;
          --green-bg: rgba(30,158,87,.22); --yellow-bg: rgba(197,139,0,.22); --red-bg: rgba(214,69,69,.2); --blue-bg: rgba(59,111,214,.24);
          --violet-bg: rgba(109,81,201,.26); --win-a: rgba(201,106,18,.12); --win-b: rgba(201,106,18,.22); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2px 2px 6px; font-family: var(--font); font-size: 13px; color: var(--text); background: transparent; -webkit-font-smoothing: antialiased; }
  #grid { display: grid; grid-template-columns: 96px repeat(5, 1fr); gap: 4px; user-select: none; padding: 10px; background: var(--bg);
          border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 1px 2px rgba(15,35,60,.05), 0 8px 24px rgba(15,35,60,.07); }
  .hdr { font-weight: 700; text-align: center; padding: 8px 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
         font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #grid > .hdr:first-child { background: var(--accent); border-color: var(--accent); color: #fff; }
  .slotlbl { display: flex; align-items: center; justify-content: center; text-align: center; padding: 2px 4px; background: var(--surface);
             border: 1px solid var(--line); border-radius: 10px; font-weight: 600; font-size: 11.5px; color: var(--muted); }
  .lunch { grid-column: 1 / span 6; text-align: center; font-size: 11px; color: var(--muted); background: repeating-linear-gradient(45deg, var(--surface) 0 6px, var(--surface-2) 6px 12px); border-radius: 8px; height: 18px; line-height: 18px; }
  .cell { min-height: 58px; border: 1px dashed var(--line-2); border-radius: 10px; background: var(--bg); transition: background .1s, border-color .1s; }
  .cell:hover { border-color: var(--accent); }
  .cell.off { background: repeating-linear-gradient(45deg, var(--surface) 0 5px, var(--surface-2) 5px 10px); border-style: solid; border-color: var(--line); }
  .stack { z-index: 2; display: flex; flex-direction: column; gap: 2px; pointer-events: none; }
  .stack .card { pointer-events: auto; margin: 1px 2px; padding: 3px 7px; }
  .card.mini .t { font-size: 11px; } .card.mini .s { font-size: 10px; }
  .cell.green  { background: var(--green-bg); border: 2px solid var(--green); }
  .cell.yellow { background: var(--yellow-bg); border: 2px solid var(--yellow); }
  .cell.orange { background: #ffe6d1; border: 2px solid #dd6b20; }
  .cell.red    { background: var(--red-bg); border: 2px solid color-mix(in srgb, var(--red) 55%, transparent); }
  .cell.current{ background: var(--blue-bg); border: 2px solid var(--blue); }
  .cell.hover  { outline: 3px solid var(--text); outline-offset: -3px; }
  .card { position: relative; z-index: 2; margin: 3px; padding: 6px 9px; border-radius: 10px; cursor: grab; color: #fff;
          box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 4px 10px rgba(15,35,60,.1); overflow: hidden; line-height: 1.3;
          transition: transform .12s, box-shadow .12s, opacity .12s; }
  .card:hover { transform: translateY(-1px); box-shadow: 0 2px 4px rgba(0,0,0,.2), 0 10px 20px rgba(15,35,60,.14); }
  .card.locked { cursor: not-allowed; opacity: .8; background-image: repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(255,255,255,.15) 5px,rgba(255,255,255,.15) 10px); }
  .card.locked::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(45deg, transparent 0 5px, rgba(255,255,255,.16) 5px 10px); }
  .card.sel { outline: 3px solid var(--text); outline-offset: 1px; }
  .card .t { font-weight: 700; font-size: 13px; }
  .card .s { font-size: 11px; opacity: .92; }
  .dragging .card { pointer-events: none; }
  .picking .card:not(.sel):not(.src) { opacity: .35; }
  .picking .card.sel { opacity: .9; }
  .dragging .card.src { opacity: .35; }
  .cell.win { background: repeating-linear-gradient(-45deg, var(--win-a) 0 6px, var(--win-b) 6px 12px); border: 1px solid var(--win); }
  .cell.win::after { content: attr(data-win); display: block; font-size: 10px; color: var(--win); text-align: center; padding-top: 18px; font-weight: 600; }
  .cell.target { background: var(--violet-bg); border: 2px solid var(--violet); }
  .targeting .card { opacity: .3; }
  .targeting .card.cand-green  { opacity: 1; outline: 3px solid var(--green); outline-offset: 1px; cursor: pointer; }
  .targeting .card.cand-yellow { opacity: 1; outline: 3px solid var(--yellow); outline-offset: 1px; cursor: pointer; }
  .opt { display: inline-block; margin-block-start: 5px; margin-inline-end: 5px; padding: 4px 11px; border-radius: 999px; cursor: pointer;
         border: 1px solid var(--line-2); background: var(--bg); color: var(--text); font-size: 12px; transition: background .1s; }
  .opt.green { border-color: var(--green); } .opt.yellow { border-color: var(--yellow); }
  .opt:hover { background: var(--surface-2); }
  #bar { margin-top: 8px; min-height: 44px; padding: 10px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; line-height: 1.55; }
  .legend:not(:empty) + #msg:not(:empty) { margin-top: 6px; }
  .legend span { display: inline-flex; align-items: center; margin-inline-end: 14px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-inline-end: 5px; vertical-align: -1px; }
  @media (prefers-reduced-motion: reduce) { .card, .cell, .opt { transition: none; } .card:hover { transform: none; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<script>
/* UETOS UI kit: follow the Streamlit theme (light/dark + primary colour). Visual only - the original script below is unchanged. */
window.addEventListener("message", function (e) {
  var d = e.data, th = d && d.type === "streamlit:render" ? d.theme : null;
  if (!th) return;
  var root = document.documentElement;
  root.setAttribute("data-theme", th.base === "dark" ? "dark" : "light");
  if (typeof th.primaryColor === "string" && /^[#\w(),.%\s-]+$/.test(th.primaryColor)) root.style.setProperty("--accent", th.primaryColor);
});
</script>
</head>
<body>
<div id="grid"></div>
<div id="bar"><div class="legend" id="legend"></div><div id="msg"></div></div>

<script>
let DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday"];
let T = {};
const fmt = (s, kw) => s.replace(/\{(\w+)\}/g, (_, k) => kw[k] ?? "");
const PALETTE = ["#4e79a7","#6b6ecf","#8c6d31","#7b4173","#3182bd","#636363","#5254a3","#843c39","#393b79","#637939","#9c755f","#17608a"];
let ARGS = null, dragId = null, selId = null, lastNonce = 0, tgtKey = null;

function send(type, extra) { window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, extra), "*"); }
const rowOf = s => s < 4 ? s + 2 : s + 3;      // row 1 = header, row 6 = lunch strip
function color(key) { let h = 0; for (const c of key) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; }

function render() {
  const g = document.getElementById("grid"); g.innerHTML = "";
  const add = (el, r, c, span) => { el.style.gridRow = span ? `${r} / span ${span}` : r; el.style.gridColumn = c; g.appendChild(el); return el; };
  add(Object.assign(document.createElement("div"), {className: "hdr", textContent: ARGS.title}), 1, 1);
  DAYS.forEach((d, i) => add(Object.assign(document.createElement("div"), {className: "hdr", textContent: d}), 1, i + 2));
  const lunch = Object.assign(document.createElement("div"), {className: "lunch", textContent: T.lunch}); lunch.style.gridRow = 6; g.appendChild(lunch);
  for (let s = 0; s < 7; s++) {
    add(Object.assign(document.createElement("div"), {className: "slotlbl", textContent: ARGS.slots[s]}), rowOf(s), 1);
    for (let d = 0; d < 5; d++) {
      const c = add(Object.assign(document.createElement("div"), {className: "cell" + (d === 2 && s >= 4 ? " off" : "")}), rowOf(s), d + 2);
      c.dataset.key = `${d},${s}`;
      if ((ARGS.windows || []).includes(c.dataset.key)) { c.classList.add("win"); c.dataset.win = "🚫 " + T.win; c.title = T.win_msg; }
      c.addEventListener("dragover", e => { if (!dragId) return; e.preventDefault(); hover(c); });
      c.addEventListener("dragleave", () => c.classList.remove("hover"));
      c.addEventListener("drop", e => { e.preventDefault(); drop(dragId, c.dataset.key); });
      c.addEventListener("click", () => {
        if (ARGS.readonly) return;
        if (selId) { drop(selId, c.dataset.key); return; }
        if (d === 2 && s >= 4) return;
        if (c.classList.contains("win")) { tgtKey = null; target(); setMsg(`<b>${DAYS[d]} – ${ARGS.slots[s]}</b>: 🚫 ${T.win_msg}`); return; }
        tgtKey = (tgtKey === c.dataset.key) ? null : c.dataset.key; target(); });
    }
  }
  const stacks = {};          // lessons sharing the same cell(s) are stacked, not drawn on top of each other
  for (const l of ARGS.lessons) {
    const k = `${l.day},${l.start},${l.duration}`;
    stacks[k] = (stacks[k] || 0) + 1;
  }
  const holders = {};
  for (const l of ARGS.lessons) {
    const el = document.createElement("div");
    el.className = "card" + (l.locked ? " locked" : "") + (l.id === selId ? " sel" : "");
    el.style.background = l.bg || color(l.colorKey);
    el.innerHTML = `<div class="t">${l.title}</div><div class="s">${l.sub}</div>`;
    el.title = l.tooltip;
    el.draggable = !l.locked && !ARGS.readonly;
    if (ARGS.readonly) el.style.cursor = "default";
    el.dataset.id = l.id;
    const sk = `${l.day},${l.start},${l.duration}`;
    if (stacks[sk] > 1) {
      if (!holders[sk]) {
        holders[sk] = add(Object.assign(document.createElement("div"), {className: "stack"}), rowOf(l.start), l.day + 2, l.duration);
      }
      el.classList.add("mini");
      holders[sk].appendChild(el);
    } else {
      add(el, rowOf(l.start), l.day + 2, l.duration);
    }
    el.addEventListener("dragstart", e => {
      dragId = l.id; e.dataTransfer.setData("text/plain", l.id); e.dataTransfer.effectAllowed = "move";
      paint(l.id); el.classList.add("src");
      setTimeout(() => document.body.classList.add("dragging"), 0);
    });
    el.addEventListener("dragend", () => { dragId = null; document.body.classList.remove("dragging"); el.classList.remove("src"); if (!selId) paint(null); });
    el.addEventListener("click", e => {
      e.stopPropagation();
      if (ARGS.readonly) return;
      if (tgtKey) {
        const st = ARGS.status[l.id][tgtKey][0];
        if (st === "green" || st === "yellow") { const k = tgtKey; tgtKey = null; drop(l.id, k); return; }
        tgtKey = null; target();
      }
      selId = (selId === l.id || l.locked) ? null : l.id; render(); paint(selId); });
  }
  send("streamlit:setFrameHeight", {height: document.body.scrollHeight + 10});
}

function paint(lid) {
  document.querySelectorAll(".cell").forEach(c => {
    c.classList.remove("green", "yellow", "orange", "red", "current", "hover");
    if (!lid) { c.title = ""; return; }
    const [st, msg] = ARGS.status[lid][c.dataset.key];
    c.classList.add(st); c.title = msg;
  });
  document.body.classList.toggle("picking", !!lid);
  const l = ARGS.lessons.find(x => x.id === lid);
  setMsg(lid ? fmt(T.moving, {t: l.title, d: l.duration, s: l.sub}) : T.hint);
}
function target() {
  document.querySelectorAll(".cell").forEach(c => c.classList.remove("target", "green", "yellow", "orange", "red", "current", "hover"));
  document.querySelectorAll(".card").forEach(c => c.classList.remove("cand-green", "cand-yellow"));
  document.body.classList.remove("picking");
  document.body.classList.toggle("targeting", !!tgtKey);
  if (!tgtKey) { setMsg(T.hint); return; }
  document.querySelector(`.cell[data-key="${tgtKey}"]`).classList.add("target");
  const [d, s] = tgtKey.split(",");
  const opts = [];
  for (const l of ARGS.lessons) {
    const [st, msg] = ARGS.status[l.id][tgtKey];
    if (st !== "green" && st !== "yellow") continue;
    opts.push([st, l, msg]);
    const card = document.querySelector(`.card[data-id="${l.id}"]`);
    if (card) card.classList.add("cand-" + st);
  }
  opts.sort((a, b) => (a[0] === "green" ? 0 : 1) - (b[0] === "green" ? 0 : 1));
  const head = `<b>${DAYS[d]} – ${ARGS.slots[s]}</b>: `;
  if (!opts.length) { setMsg(head + T.tgt_none); return; }
  setMsg(head + fmt(T.tgt_head, {n: opts.length}) + "<br>" + opts.map(([st, l, msg], i) =>
    `<span class="opt ${st}" data-i="${i}" title="${msg.replace(/"/g, "&quot;")}">${st === "green" ? "🟢" : "🟡"} ${l.title} · ${DAYS[l.day]} ${ARGS.slots[l.start]}</span>`).join(""));
  document.querySelectorAll(".opt").forEach(o => o.addEventListener("click", () => {
    const l = opts[+o.dataset.i][1]; const k = tgtKey; tgtKey = null; drop(l.id, k); }));
}
function hover(c) {
  document.querySelectorAll(".cell.hover").forEach(x => x !== c && x.classList.remove("hover"));
  c.classList.add("hover");
  const [st, msg] = ARGS.status[dragId][c.dataset.key];
  const [d, s] = c.dataset.key.split(",");
  setMsg(`<b>${DAYS[d]} – ${ARGS.slots[s]}</b>: <span style="color:${{green:"#2ea043",yellow:"#9a7700",orange:"#dd6b20",red:"#e5534b",current:"#4a7bd0"}[st]}">${T["st_" + st]}</span> – ${msg}`);
}
function drop(lid, key) {
  const [st, msg] = ARGS.status[lid][key];
  if (st === "red") { setMsg(fmt(T.not_allowed, {m: msg})); return; }
  if (st === "current") { return; }
  const [d, s] = key.split(",").map(Number);
  selId = null;
  send("streamlit:setComponentValue", {value: {lid, day: d, slot: s, nonce: Date.now()}, dataType: "json"});
  setMsg(T.applying);
}
function setMsg(h) { document.getElementById("msg").innerHTML = h; send("streamlit:setFrameHeight", {height: document.body.scrollHeight + 10}); }

window.addEventListener("message", e => {
  if (e.data.type !== "streamlit:render") return;
  ARGS = e.data.args.data; T = ARGS.i18n; DAYS = ARGS.days;
  document.documentElement.dir = ARGS.rtl ? "rtl" : "ltr";
  document.getElementById("legend").innerHTML =
    `<span><i style="background:#2ea043"></i>${T.free}</span><span><i style="background:#d4a400"></i>${T.swap}</span>` +
    (ARGS.free ? `<span><i style="background:#dd6b20"></i>${T.forced}</span>` : "") +
    `<span><i style="background:#e5534b"></i>${T.impossible}</span><span><i style="background:#4a7bd0"></i>${T.current}</span>`;
  document.getElementById("bar").style.display = ARGS.readonly ? "none" : "";
  render(); if (tgtKey) target(); else paint(selId);
});
send("streamlit:componentReady", {apiVersion: 1});
</script>
</body>
</html>
